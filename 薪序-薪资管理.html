ion setCoinPile(amount){const box=$('coinBox'),pile=$('coinPile'),w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;const cols=Math.max(1,Math.floor((w-4)/12)),rows=Math.max(1,Math.floor((h-13)/9)),capacity=cols*rows,target=Math.round(Math.min(1,Math.max(0,amount/20000))*capacity);pile.innerHTML='';for(let i=0;i<target;i++){const coin=document.createElement('i'),row=Math.floor(i/cols),col=i%cols;coin.className='settled-coin';coin.style.left=(col*12+(row%2?5:0))+'px';coin.style.bottom=(row*8)+'px';coin.style.transform='rotate('+(((i*37)%34)-17)+'deg)';coin.style.animationDelay=Math.min(i*.003,.18)+'s';pile.appendChild(coin)}}function burstCoins(delta){const box=$('coinBox'),layer=$('coinBurst'),w=box.clientWidth,h=box.clientHeight;if(!w||!h||delta<=0)return;layer.innerHTML='';const count=Math.min(48,Math.max(3,Math.round(delta/40)));for(let i=0;i<count;i++){const coin=document.createElement('i');coin.className='burst-coin';coin.style.setProperty('--dx',(Math.random()*(w*.84)-w*.42)+'px');coin.style.setProperty('--dy',(h*.76+Math.random()*12)+'px');coin.style.animationDelay=(Math.random()*.12)+'s';layer.appendChild(coin)}clearTimeout(coinDrawTimer);coinDrawTimer=setTimeout(()=>{layer.innerHTML='';const value=Number($('currentTotal').dataset.value||0);setCoinPile(value)},980)}function updateCoins(amount){const old=previousCoinTotal;previousCoinTotal=amount;$('currentTotal').dataset.value=amount;if(old===null){setCoinPile(amount);return}if(amount>old){burstCoins(amount-old)}else if(amount<old){setCoinPile(amount)}}function syncAquarium(){const lifetime=entries.reduce((sum,e)=>sum+Number(e.amount||0),0),unlocked=fishPlan.filter(f=>lifetime>=f.at);$('tankTotal').textContent='累计 '+money(lifetime);const next=fishPlan.find(f=>lifetime<f.at);$('fishNext').textContent=next?'下一种 '+next.name+' · '+money(next.at):'鱼群已全部解锁';$('fishProgress').style.width=next?Math.max(0,Math.min(100,((lifetime-(fishPlan[unlocked.length-1]?.at||0))/(next.at-(fishPlan[unlocked.length-1]?.at||0)))*100))+'%':'100%';$('fishCount').textContent=unlocked.length?unlocked.length+' 种鱼 · '+unlocked.reduce((n,f)=>n+f.count,0)+' 条':'鱼群等待第一笔收入';$('fishUnlock').textContent=unlocked.length>previousUnlocks?'新鱼入缸：'+unlocked[unlocked.length-1].name:'';if(unlocked.length>previousUnlocks&&previousUnlocks>0)notify('达成 '+money(unlocked[unlocked.length-1].at)+'，'+unlocked[unlocked.length-1].name+' 入缸！');previousUnlocks=unlocked.length;const wanted=[];unlocked.forEach((spec,index)=>{for(let j=0;j<spec.count;j++){const id=index+'-'+j;wanted.push(id);if(!swimFish.some(f=>f.id===id)){swimFish.push({id,spec,x:-.12-Math.random()*.32,y:.29+Math.random()*.43,phase:Math.random()*Math.PI*2,speed:.000035+Math.random()*.000025,scale:.68+Math.random()*.4,entered:performance.now()})}}});swimFish=swimFish.filter(f=>wanted.includes(f.id))}function resizeAquarium(){if(!aquariumCanvas)return;const rect=aquariumCanvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);aquariumWidth=rect.width;aquariumHeight=rect.height;aquariumCanvas.width=Math.round(rect.width*dpr);aquariumCanvas.height=Math.round(rect.height*dpr);aquariumCtx.setTransform(dpr,0,0,dpr,0,0)}function drawAquarium(time){if(!aquariumCtx)return;const w=aquariumWidth,h=aquariumHeight,c=aquariumCtx; c.clearRect(0,0,w,h);const bg=c.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#1181bb');bg.addColorStop(.38,'#075583');bg.addColorStop(1,'#062944');c.fillStyle=bg;c.fillRect(0,0,w,h);const sun=c.createRadialGradient(w*.46,0,3,w*.46,h*.48,w*.65);sun.addColorStop(0,'#b9f6ff42');sun.addColorStop(1,'#6ce2ff00');c.fillStyle=sun;c.fillRect(0,0,w,h);for(let i=0;i<8;i++){const x=(i/7)*w,dx=Math.sin(time*.0007+i)*10;c.beginPath();c.moveTo(x-9,0);c.lineTo(x+14+dx,h*.72);c.lineTo(x+28+dx,h*.72);c.lineTo(x+1,0);c.fillStyle='rgba(170,239,255,.035)';c.fill()}c.beginPath();c.moveTo(0,h*.89);for(let x=0;x<=w;x+=12)c.lineTo(x,h*.89+Math.sin(x*.032+time*.002)*2);c.lineTo(w,h);c.lineTo(0,h);c.closePath();c.fillStyle='#d6c58d';c.fill();for(let i=0;i<40;i++){const x=(i*71%Math.max(1,w)),y=h*.92+(i%5)*h*.014;c.fillStyle=i%3?'#8d805d':'#eee0b4';c.beginPath();c.ellipse(x,y,1.5+(i%3),1,0,0,Math.PI*2);c.fill()}for(let i=0;i<8;i++){const x=(i+.5)*w/8,y=h*.87,ht=h*(.12+(i%4)*.035);c.strokeStyle=['#2c9c79','#448d67','#389c83'][i%3];c.lineWidth=2.2;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.sin(time*.001+i)*9,y-ht*.5,x+Math.sin(time*.0013+i)*7,y-ht);c.stroke();for(let j=1;j<5;j++){const py=y-ht*j/5,px=x+Math.sin(time*.001+i)*j*1.5;c.fillStyle=i%2?'#40ac7c':'#6ac17f';c.beginPath();c.ellipse(px-5,py,6,2.2,-.45,0,Math.PI*2);c.ellipse(px+5,py-3,6,2.2,.45,0,Math.PI*2);c.fill()}}for(let i=0;i<5;i++){const x=w*(.12+i*.19),y=h*.88,rx=13+(i%3)*9;c.fillStyle=['#677d83','#756d70','#546d76'][i%3];c.beginPath();c.ellipse(x,y-rx*.35,rx,rx*.65,0,Math.PI,Math.PI*2);c.fill();c.fillStyle='#e08a6a';for(let k=0;k<3;k++){c.beginPath();c.arc(x-rx*.35+k*rx*.35,y-rx*.6,2,0,Math.PI*2);c.fill()}}for(let i=0;i<15;i++){const x=(i*97+Math.sin(time*.001+i)*10)%w,y=h-((time*.025+i*47)%(h*.8)),r=1.3+(i%3)*.8;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle='rgba(205,247,255,.38)';c.fill()}swimFish.forEach((f,i)=>{const travel=((time-f.entered)*f.speed)%1.55;f.x=travel-.22;const fx=f.x*w,fy=(f.y+Math.sin(time*.0012+f.phase)*.025)*h;if(fx<-45||fx>w+45)return;const size=12*f.scale*(w<400?.84:1),dir=1;c.save();c.translate(fx,fy);c.scale(dir,1);const wag=Math.sin(time*.018+f.phase)*.16;c.fillStyle=f.spec.color;c.beginPath();c.moveTo(-size*.45,0);c.lineTo(-size*1.05,-size*.42+wag*size);c.lineTo(-size*.97,size*.4+wag*size);c.closePath();c.fill();c.beginPath();c.ellipse(0,0,size*.63,size*.37,0,0,Math.PI*2);c.fill();c.fillStyle=f.spec.stripe;c.beginPath();c.ellipse(-size*.17,0,size*.12,size*.34,0,0,Math.PI*2);c.fill();if(f.spec.name.includes('小丑')){c.beginPath();c.ellipse(size*.18,0,size*.1,size*.33,0,0,Math.PI*2);c.fill()}c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.moveTo(-size*.12,-size*.25);c.lineTo(size*.08,-size*.55);c.lineTo(size*.32,-size*.3);c.fill();c.fillStyle='#17212a';c.beginPath();c.arc(size*.42,-size*.08,Math.max(1,size*.055),0,Math.PI*2);c.fill();c.restore()});const waveY=h*.095+Math.sin(time*.001)*2;c.beginPath();c.moveTo(0,waveY);for(let x=0;x<=w;x+=8)c.lineTo(x,waveY+Math.sin(x*.025+time*.002)*1.8);c.strokeStyle='rgba(190,246,255,.55)';c.lineWidth=1.3;c.stroke();requestAnimationFrame(drawAquarium)}function initAquarium(){aquariumCanvas=$('fishCanvas');aquariumCtx=aquariumCanvas.getContext('2d');resizeAquarium();new ResizeObserver(resizeAquarium).observe(aquariumCanvas);requestAnimationFrame(drawAquarium)}function initCalendar(){const today=new Date(),nextYear=today.getFullYear()+1,isLeap=(nextYear%4===0&&nextYear%100!==0)||nextYear%400===0;$('nextYearLabel').textContent=nextYear+'年';$('nextYearDays').textContent=isLeap?'366 天':'365 天';const dateKey=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()),newYear=new Date(nextYear,0,1);$('nextYearCountdown').textContent='距离元旦还有 '+Math.round((dateKey(newYear)-dateKey(today))/86400000)+' 天';const cny={2026:'2026-02-17',2027:'2027-02-06',2028:'2028-01-26',2029:'2029-02-13',2030:'2030-02-03',2031:'2031-01-23',2032:'2032-02-11',2033:'2033-01-31',2034:'2034-02-19',2035:'2035-02-08',2036:'2036-01-28',2037:'2037-02-15'};let spring=Object.values(cny).map(v=>new Date(v+'T00:00:00')).find(d=>dateKey(d)>=dateKey(today));if(!spring)spring=new Date(today.getFullYear()+1,1,6);$('springDays').textContent=Math.round((dateKey(spring)-dateKey(today))/86400000)+' 天';$('springDate').textContent=spring.getFullYear()+'年'+(spring.getMonth()+1)+'月'+spring.getDate()+'日';$('monthDays').textContent=Math.max(0,Math.round((Date.UTC(today.getFullYear(),today.getMonth()+1,1)-dateKey(today))/86400000)-1)+' 天'}function render(){const totals={};for(const e of entries)totals[e.month]=(totals[e.month]||0)+Number(e.amount||0);const total=totals[current]||0;syncAquarium();$('currentTotal').textContent=money(total);updateCoins(total);const day=now.getDate(),level=Math.max(0,Math.min(100,((30-(day-1))/30)*100));$('water').style.height=level+'%';$('waterLabel').textContent=Math.round(level)+'%';const history=$('history'),expandedGroups=new Set(Array.from(history.querySelectorAll('.group-toggle[aria-expanded="true"]')).map(b=>b.dataset.expand)),months=Object.keys(totals).sort().reverse();if(!months.includes(current))months.unshift(current);$('entryCount').textContent='本月 '+entries.filter(e=>e.month===current).length+' 笔';const kinds=['work','shoot','camera'];history.innerHTML=months.map(m=>{const [y,mo]=m.split('-'),list=entries.map((e,i)=>({...e,_i:i})).filter(e=>e.month===m).reverse(),monthTotal=totals[m]||0,title=y+'年'+Number(mo)+'月'+(m===current?' · 本月':'');const groups=kinds.map(kind=>{const rows=list.filter(e=>e.kind===kind),sum=rows.reduce((a,e)=>a+Number(e.amount||0),0),gid='g-'+m+'-'+kind;const items=rows.length?rows.map(e=>'<div class="entry"><div class="entry-info"><div class="entry-name">'+names[e.kind]+'</div><div class="entry-time">'+dateText(e)+'</div></div><div class="entry-amount">+'+money(e.amount)+'</div><button class="undo" data-undo="'+(e.id||e._i)+'" title="撤回这笔">撤回</button></div>').join(''):'<div class="group-empty">还没有这类记录</div>';return '<div class="income-group"><button class="group-toggle" type="button" aria-expanded="'+expandedGroups.has(gid)+'" data-expand="'+gid+'"><span class="entry-icon">'+icons[kind]+'</span><span class="group-title">'+names[kind]+'</span><span class="group-meta">'+rows.length+' 笔</span><span class="group-sum">'+money(sum)+'</span><span class="chevron">⌄</span></button><div class="group-details'+(expandedGroups.has(gid)?' open':'')+'" id="'+gid+'">'+items+'</div></div>'}).join('');return '<div class="month-block"><div class="month-head"><span>'+title+'</span><span>合计 '+money(monthTotal)+'</span></div><div class="group-list">'+groups+'</div></div>'}).join('')||'<div class="empty">点击上方按钮，记下第一笔收入吧</div>'}function save(){localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem('my-monthly-income-deletions-v1',JSON.stringify(deletedRecords));render();window.dispatchEvent(new Event('payroll:changed'))}function notify(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),1800)}function rain(source){const rect=source.getBoundingClientRect();for(let i=0;i<7;i++){const coin=document.createElement('div');coin.className='coin';coin.textContent='¥';coin.style.left=(rect.left+Math.random()*rect.width)+'px';coin.style.animationDelay=(Math.random()*.24)+'s';coin.style.animationDuration=(.85+Math.random()*.5)+'s';document.body.appendChild(coin);setTimeout(()=>coin.remove(),1500)}}function undoEntry(id){let index=entries.findIndex(e=>(e.id||String(entries.indexOf(e)))===id);if(index<0)return;const e=entries[index];entries.splice(index,1);deletedRecords=deletedRecords.filter(d=>d.id!==e.id);deletedRecords.push({id:e.id,deletedAt:new Date().toISOString()});save();notify(`已撤回「${names[e.kind]||'收入'}」 ${money(e.amount)}`)}$('history').addEventListener('click',e=>{const toggle=e.target.closest('[data-expand]');if(toggle){const panel=$(toggle.dataset.expand),open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));panel.classList.toggle('open',open);return}const undo=e.target.closest('[data-undo]');if(undo)undoEntry(undo.dataset.undo)});document.querySelectorAll('.action').forEach(button=>button.addEventListener('click',()=>{const kind=button.dataset.kind;entries.push({id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`,month:current,kind,amount:prices[kind],time:new Date().toISOString(),updatedAt:new Date().toISOString()});save();$('currentTotal').classList.remove('bump');void $('currentTotal').offsetWidth;$('currentTotal').classList.add('bump');notify(`已记入「${names[kind]}」 +${money(prices[kind])}`)}));initCalendar();initAquarium();render();window.PayrollBridge={read:()=>({entries,deletedRecords}),replace:(rows,deletions)=>{entries=rows;deletedRecords=deletions;localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem('my-monthly-income-deletions-v1',JSON.stringify(deletedRecords));render()},setStatus:(label)=>{const el=document.getElementById('cloudStatus');if(el)el.textContent=label}}})();
